apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform
labels:
  - pairs:
      environment: dev
    includeSelectors: false
resources:
  - ../../base
patches:
  # dev hostname on the static ingress IP (nip.io); a real zone replaces this later.
  - target:
      kind: Ingress
      name: argocd-server
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: argo.20.91.237.179.nip.io
