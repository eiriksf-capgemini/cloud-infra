# Installs Tekton into the platform namespace through the Tekton Operator
# (operator itself: gitops/platform/tekton-operator, a cluster-level platform app).
# TektonConfig is cluster-scoped; the operator reconciles components into targetNamespace.
apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  name: config
spec:
  # all = Pipelines + Triggers + Dashboard on Kubernetes (Chains/Results disabled below).
  # The Dashboard must come from TektonConfig: the operator removes standalone
  # TektonDashboard objects when the profile is not "all".
  profile: all
  targetNamespace: platform
  dashboard:
    # The dashboard has NO authentication of its own. Keep it read-only wherever it is
    # reachable without an authenticating proxy (oauth2-proxy / Entra ID) in front.
    readonly: true
  # Chains (artifact signing) and Results (run archive with its own Postgres) are installed
  # unless disabled, whatever the profile. Off for now: ~6 pods / ~600m CPU requests on a
  # 2-vCPU node. Enable Results when build history matters.
  chain:
    disabled: true
  result:
    disabled: true
  pruner:
    disabled: false
    resources:
      - pipelinerun
      - taskrun
    keep: 20
    schedule: "0 3 * * *"
  pipeline:
    disable-affinity-assistant: true
    enable-api-fields: beta
    # Upstream requests 100m CPU for each of these three deployments; measured idle use is a
    # few millicores. 300m is 16% of the 2-vCPU node (ADR 0004). Limits stay upstream.
    options:
      deployments:
        tekton-pipelines-webhook:
          spec:
            template:
              spec:
                containers:
                  - name: webhook
                    resources:
                      requests:
                        cpu: 20m
                        memory: 100Mi
        tekton-pipelines-remote-resolvers:
          spec:
            template:
              spec:
                containers:
                  - name: controller
                    resources:
                      requests:
                        cpu: 20m
                        memory: 100Mi
        tekton-operator-proxy-webhook:
          spec:
            template:
              spec:
                containers:
                  - name: proxy
                    resources:
                      requests:
                        cpu: 20m
                        memory: 100Mi
