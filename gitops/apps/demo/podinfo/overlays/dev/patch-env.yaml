apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: podinfo
          env:
            - name: PODINFO_UI_MESSAGE
              value: "podinfo on azure-dev"
            - name: PODINFO_UI_COLOR
              value: "#2e7d32"
