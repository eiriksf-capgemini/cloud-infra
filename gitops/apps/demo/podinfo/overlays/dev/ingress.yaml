# Dev-only ingress using a nip.io hostname on the ingress-nginx static public IP, so the app
# is reachable without owning a DNS zone. Replace with a real host + cert-manager TLS later.
# The backend is the KEDA HTTP interceptor (scale to zero, ADR 0010), not the app Service;
# the interceptor matches on the Host header and forwards to the podinfo Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podinfo
  annotations:
    # The interceptor needs the original Host to pick the HTTPScaledObject.
    nginx.ingress.kubernetes.io/upstream-vhost: podinfo.20.91.237.179.nip.io
spec:
  ingressClassName: nginx
  rules:
    - host: podinfo.20.91.237.179.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keda-http-interceptor
                port:
                  number: 8080
