# Overridden by the root Application via Helm parameters (set from OpenTofu),
# so the real repo URL never needs to live in Git.
repoURL: https://github.com/CHANGEME/cloud-infra.git
targetRevision: main

destinationServer: https://kubernetes.default.svc
project: default

# Which environment this cluster serves. Selects gitops/apps/*/overlays/<environment>.
environment: dev

# Workload app-of-apps: an ApplicationSet discovers every directory matching
# <workloads.path>/<namespace>/<app>/overlays/<environment> and creates one
# Application per app, named <namespace>-<app>.
workloads:
  enabled: true
  path: gitops/apps
  syncWave: "30"

# Cluster-level platform services (third-party, each in its own namespace).
#  - with `chart`: multi-source Application = upstream Helm chart + gitops/platform/<name>/values.yaml
#  - without `chart`: kustomize directory gitops/platform/<name>/ (e.g. upstream release YAML)
# Namespaced platform tooling that belongs to the `platform` namespace (Tekton, dashboards)
# lives under gitops/apps/platform/ instead and is discovered by the workloads ApplicationSet.
apps:
  ingress-nginx:
    enabled: true
    namespace: ingress-nginx
    chartRepoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    chartVersion: 4.15.1
    syncWave: "10"

  cert-manager:
    enabled: true
    namespace: cert-manager
    chartRepoURL: https://charts.jetstack.io
    chart: cert-manager
    chartVersion: v1.21.2
    syncWave: "10"
    # cert-manager CRDs carry large annotations; server-side apply avoids the
    # "metadata.annotations: Too long" error.
    serverSideApply: true
    # Two runtime mutations would otherwise keep the app permanently OutOfSync:
    #  - cainjector writes the CA bundle into the webhook configs;
    #  - the AKS admissions enforcer injects namespaceSelector expressions that exempt
    #    kube-system / control-plane namespaces (Azure-specific).
    ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        jqPathExpressions:
          - .webhooks[].clientConfig.caBundle
          - .webhooks[].namespaceSelector.matchExpressions[] | select(.key == "kubernetes.azure.com/managedby" or .key == "control-plane")
      - group: admissionregistration.k8s.io
        kind: MutatingWebhookConfiguration
        jqPathExpressions:
          - .webhooks[].clientConfig.caBundle
          - .webhooks[].namespaceSelector.matchExpressions[] | select(.key == "kubernetes.azure.com/managedby" or .key == "control-plane")

  aks-metrics-server:
    # Azure-specific (ADR 0004): fixed-size metrics-server via the AKS NannyConfiguration
    # ConfigMap, so the two managed replicas stop requesting ~150m CPU each on a 2-vCPU node.
    enabled: true
    namespace: kube-system
    createNamespace: false
    syncWave: "10"

  tekton-operator:
    # Tekton Operator (upstream release YAML, pinned in gitops/platform/tekton-operator, v0.77.0).
    # Installs itself into tekton-operator; the TektonConfig in gitops/apps/platform/tekton
    # then targets the platform namespace. Operator's own namespace comes from the YAML.
    enabled: true
    namespace: tekton-operator
    createNamespace: false
    serverSideApply: true
    syncWave: "20"
    # The API server adds preserveUnknownFields to every CRD; not part of the manifest.
    ignoreDifferences:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        jsonPointers:
          - /spec/preserveUnknownFields

  azure-monitor-metrics:
    # Azure-specific (ADR 0008): settings ConfigMap for the AKS metrics add-on, read by the
    # ama-metrics pods in kube-system. Enables prometheus.io/scrape annotation scraping for
    # the workload namespaces. Harmless if the add-on is off.
    enabled: true
    namespace: kube-system
    createNamespace: false
    syncWave: "10"

  # ---------------------------------------------------------------------------------------
  # OpenChoreo (ADR 0010) and what it needs, in sync-wave order. OCI chart repos are given
  # without the oci:// scheme (Argo CD convention). Namespaces are upstream's: the charts
  # hard-code them in hundreds of places, so they cannot move into `platform`.
  # ---------------------------------------------------------------------------------------
  gateway-api-crds:
    # Kubernetes Gateway API standard CRDs, pinned (kustomize, remote release YAML).
    enabled: true
    namespace: kube-system
    createNamespace: false
    serverSideApply: true
    syncWave: "5"
    ignoreDifferences:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        jsonPointers:
          - /spec/preserveUnknownFields

  storage-classes:
    # managed-csi-immediate for charts that create PVCs as hooks (ThunderID).
    enabled: true
    namespace: kube-system
    createNamespace: false
    syncWave: "5"

  external-secrets:
    enabled: true
    namespace: external-secrets
    chartRepoURL: ghcr.io/external-secrets/charts
    chart: external-secrets
    chartVersion: 2.0.1
    serverSideApply: true
    syncWave: "10"

  platform-secrets:
    # Shared admin password from Key Vault via External Secrets (ADR 0011); needs the ESO
    # CRDs (wave 10) and the thunder namespace.
    enabled: true
    namespace: thunder
    syncWave: "12"

  openbao:
    # Dev mode, in-memory; see gitops/platform/openbao/values.yaml.
    enabled: true
    namespace: openbao
    chartRepoURL: ghcr.io/openbao/charts
    chart: openbao
    chartVersion: 0.25.6
    syncWave: "10"

  keda:
    enabled: true
    namespace: keda
    chartRepoURL: https://kedacore.github.io/charts
    chart: keda
    chartVersion: 2.21.0
    serverSideApply: true
    syncWave: "10"
    # cert-controller injects the CA into the webhook at runtime.
    ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        jqPathExpressions:
          - .webhooks[].clientConfig.caBundle

  keda-add-ons-http:
    enabled: true
    namespace: keda
    chartRepoURL: https://kedacore.github.io/charts
    chart: keda-add-ons-http
    chartVersion: 0.16.0
    syncWave: "12"

  kgateway-crds:
    # Vendored + patched CRDs (kustomize), not the chart: see gitops/platform/kgateway-crds.
    enabled: true
    namespace: openchoreo-control-plane
    createNamespace: false
    serverSideApply: true
    syncWave: "12"
    ignoreDifferences:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        jsonPointers:
          - /spec/preserveUnknownFields

  kgateway:
    enabled: true
    namespace: openchoreo-control-plane
    chartRepoURL: cr.kgateway.dev/kgateway-dev/charts
    chart: kgateway
    chartVersion: v2.3.1
    syncWave: "15"

  openchoreo-gateway-params:
    # Both OpenChoreo namespaces + the GatewayParameters that make the proxies ClusterIP.
    enabled: true
    namespace: openchoreo-control-plane
    createNamespace: false
    syncWave: "16"

  openchoreo-secrets:
    # ClusterSecretStore (OpenBao) + the Backstage ExternalSecret.
    enabled: true
    namespace: openbao
    createNamespace: false
    syncWave: "18"

  thunder:
    # ThunderID identity provider; HTTPRoute attaches to the control-plane Gateway.
    enabled: true
    namespace: thunder
    chartRepoURL: ghcr.io/thunder-id/helm-charts
    chart: thunderid
    chartVersion: 1.0.1
    syncWave: "20"

  openchoreo-control-plane:
    enabled: true
    namespace: openchoreo-control-plane
    createNamespace: false
    chartRepoURL: ghcr.io/openchoreo/helm-charts
    chart: openchoreo-control-plane
    chartVersion: 1.3.1
    serverSideApply: true
    syncWave: "25"
    ignoreDifferences:
      # The chart ships this ConfigMap as a placeholder; gitops/platform/openchoreo-gateway-ca
      # fills in the real CA. Without this, self-heal would put the placeholder back.
      - group: ""
        kind: ConfigMap
        name: cluster-gateway-ca
        namespace: openchoreo-control-plane
        jsonPointers:
          - /data/ca.crt
      # Gateway API defaults group/kind/weight on refs; the chart omits them.
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
        jqPathExpressions:
          - .spec.parentRefs[].group
          - .spec.parentRefs[].kind
          - .spec.rules[].backendRefs[].group
          - .spec.rules[].backendRefs[].kind
          - .spec.rules[].backendRefs[].weight

  openchoreo-gateway-ca:
    # Sync hook Job: cluster-gateway CA Secret -> ConfigMaps in both plane namespaces.
    enabled: true
    namespace: openchoreo-control-plane
    createNamespace: false
    syncWave: "28"

  openchoreo-data-plane:
    enabled: true
    namespace: openchoreo-data-plane
    createNamespace: false
    chartRepoURL: ghcr.io/openchoreo/helm-charts
    chart: openchoreo-data-plane
    chartVersion: 1.3.1
    syncWave: "30"

  openchoreo-ingress:
    # ingress-nginx -> the two ClusterIP kgateway proxies (one public IP for the whole POC).
    enabled: true
    namespace: openchoreo-control-plane
    createNamespace: false
    syncWave: "30"

  openchoreo-config:
    # ClusterDataPlane registration + upstream getting-started sample (environments, pipeline,
    # project, component types) in the `default` namespace.
    enabled: true
    namespace: default
    createNamespace: false
    serverSideApply: true
    syncWave: "35"
    # The OpenChoreo webhook defaults these on admission; the upstream sample omits them.
    ignoreDifferences:
      - group: openchoreo.dev
        kind: ClusterTrait
        jqPathExpressions:
          - .spec.patches[].targetPlane
      - group: openchoreo.dev
        kind: ClusterComponentType
        jqPathExpressions:
          - .spec.resources[].targetPlane
      - group: openchoreo.dev
        kind: DeploymentPipeline
        jqPathExpressions:
          - .metadata.finalizers
          - .spec.promotionPaths[].sourceEnvironmentRef.kind
          - .spec.promotionPaths[].targetEnvironmentRefs[].kind

  external-dns:
    # Needs an Azure DNS zone and a workload identity before it can do anything.
    enabled: false
    namespace: external-dns
    chartRepoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    chartVersion: 1.19.0
    syncWave: "20"
