# Overridden by the root Application via Helm parameters (set from OpenTofu),
# so the real repo URL never needs to live in Git.
repoURL: https://github.com/CHANGEME/cloud-infra.git
targetRevision: main

destinationServer: https://kubernetes.default.svc
project: default

# Which environment this cluster serves. Selects gitops/apps/*/overlays/<environment>.
environment: dev

# Workload app-of-apps: an ApplicationSet discovers every directory matching
# <workloads.path>/<namespace>/<app>/overlays/<environment> and creates one
# Application per app, named <namespace>-<app>.
workloads:
  enabled: true
  path: gitops/apps
  syncWave: "30"

# Cluster-level platform services (third-party, each in its own namespace).
#  - with `chart`: multi-source Application = upstream Helm chart + gitops/platform/<name>/values.yaml
#  - without `chart`: kustomize directory gitops/platform/<name>/ (e.g. upstream release YAML)
# Namespaced platform tooling that belongs to the `platform` namespace (Tekton, dashboards)
# lives under gitops/apps/platform/ instead and is discovered by the workloads ApplicationSet.
apps:
  ingress-nginx:
    enabled: true
    namespace: ingress-nginx
    chartRepoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    chartVersion: 4.15.1
    syncWave: "10"

  cert-manager:
    enabled: true
    namespace: cert-manager
    chartRepoURL: https://charts.jetstack.io
    chart: cert-manager
    chartVersion: v1.21.2
    syncWave: "10"
    # cert-manager CRDs carry large annotations; server-side apply avoids the
    # "metadata.annotations: Too long" error.
    serverSideApply: true
    # Two runtime mutations would otherwise keep the app permanently OutOfSync:
    #  - cainjector writes the CA bundle into the webhook configs;
    #  - the AKS admissions enforcer injects namespaceSelector expressions that exempt
    #    kube-system / control-plane namespaces (Azure-specific).
    ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        jqPathExpressions:
          - .webhooks[].clientConfig.caBundle
          - .webhooks[].namespaceSelector.matchExpressions[] | select(.key == "kubernetes.azure.com/managedby" or .key == "control-plane")
      - group: admissionregistration.k8s.io
        kind: MutatingWebhookConfiguration
        jqPathExpressions:
          - .webhooks[].clientConfig.caBundle
          - .webhooks[].namespaceSelector.matchExpressions[] | select(.key == "kubernetes.azure.com/managedby" or .key == "control-plane")

  aks-metrics-server:
    # Azure-specific (ADR 0004): fixed-size metrics-server via the AKS NannyConfiguration
    # ConfigMap, so the two managed replicas stop requesting ~150m CPU each on a 2-vCPU node.
    enabled: true
    namespace: kube-system
    createNamespace: false
    syncWave: "10"

  tekton-operator:
    # Tekton Operator (upstream release YAML, pinned in gitops/platform/tekton-operator, v0.77.0).
    # Installs itself into tekton-operator; the TektonConfig in gitops/apps/platform/tekton
    # then targets the platform namespace. Operator's own namespace comes from the YAML.
    enabled: true
    namespace: tekton-operator
    createNamespace: false
    serverSideApply: true
    syncWave: "20"
    # The API server adds preserveUnknownFields to every CRD; not part of the manifest.
    ignoreDifferences:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        jsonPointers:
          - /spec/preserveUnknownFields

  external-dns:
    # Needs an Azure DNS zone and a workload identity before it can do anything.
    enabled: false
    namespace: external-dns
    chartRepoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    chartVersion: 1.19.0
    syncWave: "20"
