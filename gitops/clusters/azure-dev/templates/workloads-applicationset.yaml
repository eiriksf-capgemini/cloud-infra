{{- if .Values.workloads.enabled }}
---
# One Application per workload, discovered from Git. Layout:
#   <workloads.path>/<namespace>/<app>/overlays/{{ .Values.environment }}
# Adding an app = adding such a directory; no change needed here. Application names are
# <namespace>-<app> so they stay unique across namespaces.
#
# Namespaces are NOT auto-created: every namespace folder must contain a `namespace` app
# that declares the Namespace object (see gitops/apps/README.md). Apps in a brand-new
# namespace fail their first sync until that app has synced, then succeed on retry.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads-{{ .Values.environment }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.workloads.syncWave | default "30" | quote }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: {{ .Values.repoURL }}
        revision: {{ .Values.targetRevision }}
        directories:
          - path: {{ .Values.workloads.path }}/*/*/overlays/{{ .Values.environment }}
  template:
    metadata:
      # path = gitops/apps/<namespace>/<app>/overlays/<env>
      #   segments[2] = namespace, segments[3] = app
      name: '{{ `{{ index .path.segments 2 }}-{{ index .path.segments 3 }}` }}'
      labels:
        app.kubernetes.io/name: '{{ `{{ index .path.segments 3 }}` }}'
        namespace: '{{ `{{ index .path.segments 2 }}` }}'
        environment: {{ .Values.environment }}
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: {{ .Values.project }}
      source:
        repoURL: {{ .Values.repoURL }}
        targetRevision: {{ .Values.targetRevision }}
        path: '{{ `{{ .path.path }}` }}'
      destination:
        server: {{ .Values.destinationServer }}
        namespace: '{{ `{{ index .path.segments 2 }}` }}'
      # Autoscalers (KEDA scale-to-zero, HPA) own spec.replicas at runtime (ADR 0010).
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # Custom resources (e.g. TektonConfig) may be applied before their CRD exists;
          # skip the dry-run for those and let the retry pick them up.
          - SkipDryRunOnMissingResource=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
{{- end }}
