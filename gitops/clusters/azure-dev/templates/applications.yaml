{{- range $name, $app := .Values.apps }}
{{- if $app.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.syncWave | default "10" | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $.Values.project }}
  {{- if $app.chart }}
  # Third-party Helm chart + values from this repo (gitops/platform/<name>/values.yaml)
  sources:
    - repoURL: {{ $app.chartRepoURL }}
      chart: {{ $app.chart }}
      targetRevision: {{ $app.chartVersion | quote }}
      helm:
        releaseName: {{ $name }}
        valueFiles:
          - $values/gitops/platform/{{ $name }}/values.yaml
    - repoURL: {{ $.Values.repoURL }}
      targetRevision: {{ $.Values.targetRevision }}
      ref: values
  {{- else }}
  # Kustomize directory in this repo (gitops/platform/<name>/), e.g. upstream release YAML
  source:
    repoURL: {{ $.Values.repoURL }}
    targetRevision: {{ $.Values.targetRevision }}
    path: gitops/platform/{{ $name }}
  {{- end }}
  destination:
    server: {{ $.Values.destinationServer }}
    namespace: {{ $app.namespace }}
  {{- with $app.ignoreDifferences }}
  ignoreDifferences:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      {{- /* createNamespace defaults to true; `default` would swallow an explicit false */}}
      {{- if or (not (hasKey $app "createNamespace")) $app.createNamespace }}
      - CreateNamespace=true
      {{- end }}
      {{- if $app.serverSideApply }}
      - ServerSideApply=true
      {{- end }}
      {{- if $app.ignoreDifferences }}
      - RespectIgnoreDifferences=true
      {{- end }}
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
{{- end }}
{{- end }}
