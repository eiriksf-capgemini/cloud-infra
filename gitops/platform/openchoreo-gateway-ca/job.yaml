# Idempotent copy of the cluster-gateway CA into the ConfigMaps the planes' agents mount.
# A CronJob rather than a Sync hook: Argo CD does not order Applications by wave unless
# Application health assessment is enabled, and a hook that fails (CA not issued yet) is not
# retried until the next sync. This runs every 5 minutes, exits quickly when the CA is not
# there yet, and also follows a CA rotation. Cost: one short kubectl pod per run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gateway-ca-sync
  namespace: openchoreo-control-plane
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 240
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 600
      template:
        spec:
          serviceAccountName: gateway-ca-sync
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kubectl
              # Needs sh + base64 + kubectl. registry.k8s.io/kubectl is distroless (StartError) and the
              # Argo CD 3.x image no longer ships kubectl (the script failed silently). alpine/k8s is
              # busybox + kubectl matching the cluster version, pinned by digest.
              image: docker.io/alpine/k8s:1.36.4@sha256:358ddfc2d6ff3f00dd461dbd79aaa6d6738709f225b8da0945bb63bd4dbc304e
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  cp=openchoreo-control-plane; dp=openchoreo-data-plane
                  if ! kubectl -n "$cp" get secret cluster-gateway-ca -o name >/dev/null; then
                    echo "secret $cp/cluster-gateway-ca not readable or not issued yet; retrying next run"; exit 0
                  fi
                  ca=$(kubectl -n "$cp" get secret cluster-gateway-ca -o jsonpath='{.data.ca\.crt}' | base64 -d)
                  [ -n "$ca" ] || { echo "empty ca.crt"; exit 1; }
                  for ns in "$cp" "$dp"; do
                    kubectl -n "$ns" create configmap cluster-gateway-ca --from-literal=ca.crt="$ca" \
                      --dry-run=client -o yaml | kubectl apply -f -
                  done
                  kubectl label namespace default openchoreo.dev/control-plane=true --overwrite
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
