apiVersion: batch/v1
kind: Job
metadata:
  name: gateway-ca-sync
  namespace: openchoreo-control-plane
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    spec:
      serviceAccountName: gateway-ca-sync
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubectl
          # Same image the control-plane chart uses for its own bootstrap job.
          image: registry.k8s.io/kubectl:v1.36.0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cp=openchoreo-control-plane; dp=openchoreo-data-plane
              echo "waiting for secret $cp/cluster-gateway-ca (issued by cert-manager)"
              until kubectl -n "$cp" get secret cluster-gateway-ca -o name >/dev/null 2>&1; do sleep 5; done
              ca=$(kubectl -n "$cp" get secret cluster-gateway-ca -o jsonpath='{.data.ca\.crt}' | base64 -d)
              [ -n "$ca" ] || { echo "empty ca.crt"; exit 1; }
              for ns in "$cp" "$dp"; do
                kubectl -n "$ns" create configmap cluster-gateway-ca --from-literal=ca.crt="$ca" \
                  --dry-run=client -o yaml | kubectl apply -f -
              done
              kubectl label namespace default openchoreo.dev/control-plane=true --overwrite
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
