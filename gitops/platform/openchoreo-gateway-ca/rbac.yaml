apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-ca-sync
  namespace: openchoreo-control-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-ca-sync
  namespace: openchoreo-control-plane
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["cluster-gateway-ca"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-ca-sync
  namespace: openchoreo-control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-ca-sync
subjects:
  - kind: ServiceAccount
    name: gateway-ca-sync
    namespace: openchoreo-control-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-ca-sync
  namespace: openchoreo-data-plane
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-ca-sync
  namespace: openchoreo-data-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-ca-sync
subjects:
  - kind: ServiceAccount
    name: gateway-ca-sync
    namespace: openchoreo-control-plane
---
# The getting-started sample puts Project/Environments into the `default` namespace, which
# OpenChoreo only treats as its own once labelled (reference install does the same).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gateway-ca-sync-namespaces
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["default"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gateway-ca-sync-namespaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gateway-ca-sync-namespaces
subjects:
  - kind: ServiceAccount
    name: gateway-ca-sync
    namespace: openchoreo-control-plane
