# Bearer token Claude Code presents when it pushes OpenTelemetry events to the portal's
# AI usage endpoint (ADR 0014). Generated in-cluster by External Secrets' Password
# generator and written once (refreshPolicy CreatedOnce): nobody has to know it except to
# copy it into their Claude Code environment, so it does not go through Key Vault like the
# human-managed secrets of ADR 0011. Deleting the Secret rotates it; a cluster recreate
# regenerates it, and reporters must be reconfigured (docs/runbooks/openchoreo-console-image.md).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ai-usage-ingest-token
  namespace: openchoreo-control-plane
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-usage-ingest
  namespace: openchoreo-control-plane
spec:
  refreshPolicy: CreatedOnce
  target:
    name: ai-usage-ingest
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ai-usage-ingest-token
