# Bearer token MCP clients (Claude Code) present to the portal's MCP server (ADR 0017).
# Same pattern as the AI usage ingest token (ADR 0014): generated in-cluster by External
# Secrets' Password generator, written once; read it back to configure a client, delete the
# Secret to rotate it. Thunder OAuth is the planned follow-up for this endpoint.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ai-elements-mcp-token
  namespace: openchoreo-control-plane
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-elements-mcp
  namespace: openchoreo-control-plane
spec:
  refreshPolicy: CreatedOnce
  target:
    name: ai-elements-mcp
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ai-elements-mcp-token
