# "AI usage & cost" widget on the portal home page (ADR 0013). Both values come from Key
# Vault (set by hand with `az keyvault secret set`, never generated: the admin key is issued
# by Anthropic) and reach Backstage as environment variables through
# backstage.extraEnv in gitops/platform/openchoreo-control-plane/values.yaml.
#   anthropic-admin-api-key  Anthropic Admin API key (sk-ant-admin...), read-only use
#   anthropic-member-email   e-mail of the Anthropic organization member the portal users map to
# Both keys must exist before External Secrets writes the Secret; until then the portal
# starts without it (the env refs are optional) and the widget shows its setup notice.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anthropic-admin
  namespace: openchoreo-control-plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: anthropic-admin
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: anthropic-admin-api-key
    - secretKey: member-email
      remoteRef:
        key: anthropic-member-email
