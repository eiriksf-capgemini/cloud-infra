# Bootstrap issuer: only used to sign the root CA below.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
# The root. Lives in cert-manager's namespace (its cluster-resource namespace), 10 years,
# rotated 30 days before expiry. Export with:
#   kubectl -n cert-manager get secret poc-root-ca -o jsonpath='{.data.ca\.crt}' | base64 -d
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: poc-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: cloud-infra POC CA
  subject:
    organizations:
      - cloud-infra POC
  secretName: poc-root-ca
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
# What applications ask for: `cert-manager.io/cluster-issuer: poc-ca` on an Ingress, or a
# Certificate with this issuerRef.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: poc-ca
spec:
  ca:
    secretName: poc-root-ca
