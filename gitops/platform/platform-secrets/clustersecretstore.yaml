# Auth: the AKS kubelet (node) managed identity over IMDS; it holds Key Vault Secrets User
# on the vault (35-secrets). identityId is omitted because the node pool carries exactly
# one identity; set it to the kubelet identity clientId if a second one is ever attached.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  provider:
    azurekv:
      authType: ManagedIdentity
      vaultUrl: "https://kv-cloudinfra-poc.vault.azure.net/"
