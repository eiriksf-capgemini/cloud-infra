# ThunderID: the chart's setup job reads the admin password from this Secret
# (setup.admin.passwordRef in gitops/platform/thunder/values.yaml) and the bootstrap users
# reference it through the setup job's ADMIN_PASSWORD environment variable.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-admin
  namespace: thunder
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: platform-admin
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: platform-admin-password
