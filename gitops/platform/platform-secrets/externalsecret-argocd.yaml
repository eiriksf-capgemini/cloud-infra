# Argo CD `admin`: bcrypt hash of the shared password merged into the chart-owned
# argocd-secret (creationPolicy Merge touches only this key). Argo CD re-reads the Secret,
# so a rotation in Key Vault reaches the login within refreshInterval. admin.passwordMtime
# is left alone: it only invalidates sessions issued before it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-admin-password
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: argocd-secret
    creationPolicy: Merge
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        # htpasswd renders "admin:<bcrypt>"; Argo CD wants the bare hash.
        admin.password: '{{ htpasswd "admin" .password "bcrypt" | trimPrefix "admin:" }}'
  data:
    - secretKey: password
      remoteRef:
        key: platform-admin-password
