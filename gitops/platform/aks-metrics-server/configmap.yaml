# Azure-specific (ADR 0004): caps the AKS-managed metrics-server at a fixed size instead of
# the VPA default of ~150m CPU per replica. On the one-node POC the two replicas were the
# largest CPU requesters on the node (2 x 151m). Documented knob:
# https://learn.microsoft.com/azure/aks/use-metrics-server-vertical-pod-autoscaler
# ("Manually configure Metrics Server resource usage"). After the first sync run
#   kubectl -n kube-system rollout restart deployment metrics-server
# once; the nanny sidecar then keeps request = limit = baseCPU / baseMemory.
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-server-config
  namespace: kube-system
  labels:
    kubernetes.io/cluster-service: "true"
    addonmanager.kubernetes.io/mode: EnsureExists
data:
  NannyConfiguration: |-
    apiVersion: nannyconfig/v1alpha1
    kind: NannyConfiguration
    baseCPU: 60m
    cpuPerNode: 0m
    baseMemory: 100Mi
    memoryPerNode: 0Mi
