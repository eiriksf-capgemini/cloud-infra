# OpenChoreo control plane (ADR 0010). Modelled on the reference single-cluster install
# (install/k3d/single-cluster/values-cp.yaml, release-v1.3): plain HTTP, hostnames on the
# ingress-nginx static IP via nip.io, Thunder as OIDC provider, secrets from OpenBao via
# External Secrets. The Gateway is ClusterIP (GatewayParameters openchoreo-cp) and is fronted
# by ingress-nginx (gitops/platform/openchoreo-ingress), which terminates TLS with the POC's
# private CA (ADR 0012). Backstage and the API fetch Thunder's OIDC metadata over that HTTPS
# and do not know the private CA, hence the two trust workarounds the upstream HTTPS install
# documents (skip_tls_verify and Node's reject-unauthorized switch). Everything is inside the
# cluster or behind the ADR 0009 allowlist; remove both when a publicly trusted CA is used.
openchoreoApi:
  http:
    hostnames:
      - api.openchoreo.20.91.237.179.nip.io
  config:
    server:
      publicUrl: "https://api.openchoreo.20.91.237.179.nip.io"
    security:
      authentication:
        jwt:
          jwks:
            skip_tls_verify: true
backstage:
  secretName: backstage-secrets   # ExternalSecret in gitops/platform/openchoreo-secrets
  # Console image from the fork (docs/runbooks/openchoreo-console-image.md): upstream
  # openchoreo-ui 1.3.1 plus the openchoreo-ai-usage-backend plugin (ADR 0013, 0014), the
  # catalog-backend-module-azure-resources module (ADR 0015), the openchoreo-azure-cost
  # backend with the Cost Insights "Azure" tab (ADR 0016), the catalog-backend-module-
  # ai-elements module with the Skill kind pages and the openchoreo-ai-elements MCP server
  # (ADR 0017), pushed to the registry.
  # Tag = <chart version>-ai-usage.<fork sha>.
  image:
    repository: acrmadbadgerbadger.azurecr.io/openchoreo-ui
    tag: 1.3.1-ai-usage.6543b9b6
  baseUrl: "https://console.openchoreo.20.91.237.179.nip.io"
  # The portal's SQLite files (catalog, AI usage rows of ADR 0014, auth keys, user settings)
  # were on an emptyDir, so every pod restart wiped them (ADR 0015 consequences). One small
  # Azure disk, default class (WaitForFirstConsumer; fine for a Deployment on one node).
  database:
    type: sqlite
    sqlite:
      persistence:
        enabled: true
        size: 2Gi
  http:
    hostnames:
      - console.openchoreo.20.91.237.179.nip.io
  auth:
    redirectUrls:
      - "https://console.openchoreo.20.91.237.179.nip.io/api/auth/openchoreo-auth/handler/frame"
  extraEnv:
    - name: NODE_TLS_REJECT_UNAUTHORIZED
      value: "0"
    # AI usage & cost widget (ADR 0013, 0014). Fed by Claude Code telemetry pushed to the
    # portal; the bearer token reporters use is generated in-cluster (`ai-usage-ingest`
    # ExternalSecret in gitops/platform/openchoreo-secrets). The Anthropic variables come
    # from Key Vault through the `anthropic-admin` ExternalSecret; only the e-mail is used
    # for the identity mapping below, the key is for the optional `anthropic` source. All
    # refs are `optional` so the portal still starts, with the widget showing its setup
    # notice, before the Secrets exist.
    - name: OPENCHOREO_FEATURES_AI_USAGE_ENABLED
      value: "true"
    - name: OPENCHOREO_AI_USAGE_SOURCE
      value: telemetry
    - name: AI_USAGE_INGEST_TOKEN
      valueFrom:
        secretKeyRef:
          name: ai-usage-ingest
          key: token
          optional: true
    # MCP server for agents (ADR 0017); token generated in-cluster like the ingest token.
    - name: AI_ELEMENTS_MCP_TOKEN
      valueFrom:
        secretKeyRef:
          name: ai-elements-mcp
          key: token
          optional: true
    - name: ANTHROPIC_ADMIN_API_KEY
      valueFrom:
        secretKeyRef:
          name: anthropic-admin
          key: api-key
          optional: true
    - name: ANTHROPIC_MEMBER_EMAIL
      valueFrom:
        secretKeyRef:
          name: anthropic-admin
          key: member-email
          optional: true
  # Rendered as app-config.extra.yaml. The seeded portal users (admin@openchoreo.dev, ...)
  # are not the identity telemetry is recorded under, so every signed-in user is reported
  # as the one e-mail stored in Key Vault (reporters tag their sessions with the same
  # address as enduser.id); the address itself stays out of this public repo (it is
  # substituted from the environment at start-up).
  appConfig:
    openchoreo:
      aiUsage:
        users:
          - email: ${ANTHROPIC_MEMBER_EMAIL}
    # Azure resources in the catalog (ADR 0015): the console queries Azure Resource Graph
    # with the kubelet identity (Reader on both resource groups, granted in
    # live/azure/poc/20-cluster) and mirrors the results as Resource entities in the
    # `azure` namespace: every resource in the two groups (23 as of 2026-10-25) plus one
    # entity per resource group, the AKS cluster linked to the OpenChoreo data plane.
    # The same subscription scopes Cost Insights → Azure (ADR 0016; Cost Management
    # Reader, same stack); `cost` keeps the defaults (hourly snapshot, 30-day window).
    azureResources:
      subscriptions:
        - bf235fd4-99f0-4ecb-9f89-5916f261844a
      resourceGroups:
        - rg-cloudinfra-poc
        - rg-cloudinfra-poc-aks-cloudinfra-poc-nodes
      types:
        - '*'
      dataPlanes:
        - cluster: aks-cloudinfra-poc
          dataPlane: default
    # AI elements in the catalog (ADR 0017): Claude Code skills, agents, prompts and hooks
    # read from Git (SKILL.md frontmatter + metadata.json, no catalog-info needed) as `Skill`
    # entities in the `ai` namespace, one System per repository. Public repositories need no
    # token; add more repositories here as they appear.
    aiElements:
      repositories:
        - url: https://github.com/eiriksf-capgemini/common-ai
          title: Common AI
          description: Agents, instructions, prompts, skills and hooks for GitHub Copilot and Claude Code, shared by AI developers at Capgemini Bergen.
      # MCP server (ADR 0017) at https://console.openchoreo.20.91.237.179.nip.io/api/openchoreo-ai-elements/mcp:
      # catalog, Azure resources and cost, platform facts, every skill as a prompt, the docs
      # below as resources. The token is substituted from Secret/ai-elements-mcp at start-up.
      # OpenChoreo objects are served by openchoreo-api's own /mcp and are not repeated here.
      mcp:
        token: ${AI_ELEMENTS_MCP_TOKEN}
        platformFacts:
          cloud: Azure (Sweden Central), subscription bf235fd4-99f0-4ecb-9f89-5916f261844a
          cluster: aks-cloudinfra-poc in rg-cloudinfra-poc (AKS 1.36, one Standard_B4s_v2 node, auto-stopped 17:00 and 22:00 Europe/Oslo)
          gitopsRepo: https://github.com/eiriksf-capgemini/cloud-infra (Argo CD; gitops/apps/<namespace>/<app>/overlays/dev; see docs resources for conventions)
          registry: acrmadbadgerbadger.azurecr.io (push after `az acr login`; images must be linux/amd64)
          ingress: ingress-nginx on 20.91.237.179; hosts are <name>.20.91.237.179.nip.io; TLS from the POC private CA (cert-manager ClusterIssuer poc-ca, trust poc-root-ca.crt)
          console: https://console.openchoreo.20.91.237.179.nip.io
          openchoreoApi: https://api.openchoreo.20.91.237.179.nip.io (MCP for OpenChoreo objects at /mcp, OAuth via Thunder)
          workloadDomain: openchoreoapis.20.91.237.179.nip.io
          namespaces: platform (Argo CD, Tekton), demo (podinfo), sogeti, invent, i-and-d (team namespaces); OpenChoreo in openchoreo-control-plane / openchoreo-data-plane
          scaleToZero: KEDA HTTP add-on; see gitops/apps/README.md (docs resource) for the HTTPScaledObject pattern
          prsBy: GitHub App hal9000-agent-bot (scripts/gh-app-token.mjs), never the human login
        docs:
          - name: cloud-infra
            title: cloud-infra ADRs, runbooks and reports
            url: https://github.com/eiriksf-capgemini/cloud-infra/tree/main/docs
          - name: cloud-infra-gitops
            title: cloud-infra GitOps conventions
            url: https://github.com/eiriksf-capgemini/cloud-infra/tree/main/gitops
security:
  oidc:
    issuer: "https://thunder.openchoreo.20.91.237.179.nip.io"
    jwksUrl: "https://thunder.openchoreo.20.91.237.179.nip.io/oauth2/jwks"
    authorizationUrl: "https://thunder.openchoreo.20.91.237.179.nip.io/oauth2/authorize"
    tokenUrl: "https://thunder.openchoreo.20.91.237.179.nip.io/oauth2/token"
gateway:
  httpPort: 80
  tls:
    enabled: false
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: openchoreo-cp
features:
  secretManagement:
    enabled: true
