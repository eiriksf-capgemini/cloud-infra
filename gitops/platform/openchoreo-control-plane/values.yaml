# OpenChoreo control plane (ADR 0010). Modelled on the reference single-cluster install
# (install/k3d/single-cluster/values-cp.yaml, release-v1.3): plain HTTP, hostnames on the
# ingress-nginx static IP via nip.io, Thunder as OIDC provider, secrets from OpenBao via
# External Secrets. The Gateway is ClusterIP (GatewayParameters openchoreo-cp) and is fronted
# by ingress-nginx (gitops/platform/openchoreo-ingress), which terminates TLS with the POC's
# private CA (ADR 0012). Backstage and the API fetch Thunder's OIDC metadata over that HTTPS
# and do not know the private CA, hence the two trust workarounds the upstream HTTPS install
# documents (skip_tls_verify and Node's reject-unauthorized switch). Everything is inside the
# cluster or behind the ADR 0009 allowlist; remove both when a publicly trusted CA is used.
openchoreoApi:
  http:
    hostnames:
      - api.openchoreo.20.91.237.179.nip.io
  config:
    server:
      publicUrl: "https://api.openchoreo.20.91.237.179.nip.io"
    security:
      authentication:
        jwt:
          jwks:
            skip_tls_verify: true
backstage:
  secretName: backstage-secrets   # ExternalSecret in gitops/platform/openchoreo-secrets
  # Console image from the fork (docs/runbooks/openchoreo-console-image.md): upstream
  # openchoreo-ui 1.3.1 plus the openchoreo-ai-usage-backend plugin (ADR 0013, 0014), the
  # catalog-backend-module-azure-resources module (ADR 0015) and the openchoreo-azure-cost
  # backend with the Cost Insights "Azure" tab (ADR 0016), pushed to the registry.
  # Tag = <chart version>-ai-usage.<fork sha>.
  image:
    repository: acrmadbadgerbadger.azurecr.io/openchoreo-ui
    tag: 1.3.1-ai-usage.37a26354
  baseUrl: "https://console.openchoreo.20.91.237.179.nip.io"
  http:
    hostnames:
      - console.openchoreo.20.91.237.179.nip.io
  auth:
    redirectUrls:
      - "https://console.openchoreo.20.91.237.179.nip.io/api/auth/openchoreo-auth/handler/frame"
  extraEnv:
    - name: NODE_TLS_REJECT_UNAUTHORIZED
      value: "0"
    # AI usage & cost widget (ADR 0013, 0014). Fed by Claude Code telemetry pushed to the
    # portal; the bearer token reporters use is generated in-cluster (`ai-usage-ingest`
    # ExternalSecret in gitops/platform/openchoreo-secrets). The Anthropic variables come
    # from Key Vault through the `anthropic-admin` ExternalSecret; only the e-mail is used
    # for the identity mapping below, the key is for the optional `anthropic` source. All
    # refs are `optional` so the portal still starts, with the widget showing its setup
    # notice, before the Secrets exist.
    - name: OPENCHOREO_FEATURES_AI_USAGE_ENABLED
      value: "true"
    - name: OPENCHOREO_AI_USAGE_SOURCE
      value: telemetry
    - name: AI_USAGE_INGEST_TOKEN
      valueFrom:
        secretKeyRef:
          name: ai-usage-ingest
          key: token
          optional: true
    - name: ANTHROPIC_ADMIN_API_KEY
      valueFrom:
        secretKeyRef:
          name: anthropic-admin
          key: api-key
          optional: true
    - name: ANTHROPIC_MEMBER_EMAIL
      valueFrom:
        secretKeyRef:
          name: anthropic-admin
          key: member-email
          optional: true
  # Rendered as app-config.extra.yaml. The seeded portal users (admin@openchoreo.dev, ...)
  # are not the identity telemetry is recorded under, so every signed-in user is reported
  # as the one e-mail stored in Key Vault (reporters tag their sessions with the same
  # address as enduser.id); the address itself stays out of this public repo (it is
  # substituted from the environment at start-up).
  appConfig:
    openchoreo:
      aiUsage:
        users:
          - email: ${ANTHROPIC_MEMBER_EMAIL}
    # Azure resources in the catalog (ADR 0015): the console queries Azure Resource Graph
    # with the kubelet identity (Reader on both resource groups, granted in
    # live/azure/poc/20-cluster) and mirrors the results as Resource entities in the
    # `azure` namespace: every resource in the two groups (23 as of 2026-10-25) plus one
    # entity per resource group, the AKS cluster linked to the OpenChoreo data plane.
    # The same subscription scopes Cost Insights → Azure (ADR 0016; Cost Management
    # Reader, same stack); `cost` keeps the defaults (hourly snapshot, 30-day window).
    azureResources:
      subscriptions:
        - bf235fd4-99f0-4ecb-9f89-5916f261844a
      resourceGroups:
        - rg-cloudinfra-poc
        - rg-cloudinfra-poc-aks-cloudinfra-poc-nodes
      types:
        - '*'
      dataPlanes:
        - cluster: aks-cloudinfra-poc
          dataPlane: default
security:
  oidc:
    issuer: "https://thunder.openchoreo.20.91.237.179.nip.io"
    jwksUrl: "https://thunder.openchoreo.20.91.237.179.nip.io/oauth2/jwks"
    authorizationUrl: "https://thunder.openchoreo.20.91.237.179.nip.io/oauth2/authorize"
    tokenUrl: "https://thunder.openchoreo.20.91.237.179.nip.io/oauth2/token"
gateway:
  httpPort: 80
  tls:
    enabled: false
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: openchoreo-cp
features:
  secretManagement:
    enabled: true
